	<script src="../@resource/js/lib/lenis.min.js"></script>
	<script>

		/* {isLayoutPath} - 레이아웃 불러오기 */
		isLayoutPath(function(){
			
			/* <isCurrent> - 메뉴 뎁스 체크 */
			isCurrent(2,4);
		});

		/* [Document Ready] (DOM) */
		/* Description: DOM 로드 시 실행 함수 */
		$(function(){

			/* <Brower Evnet> - 로드 후 이벤트 */
			const body = document.body;
			body.classList.remove('loaded'); // 있다면 초기화 후
			body.classList.add('loaded'); 	 // 초기화 이후 로드

			/* <Scroll Reset> - 스크롤 새로고침 */
			isScrollResetLenis();
			isTab();

			/* <Lenis Scroll Stop> - Lenis Scroll 초기 정지 */
			//window.lenis.stop(); 

			/* {GSAP Lib} - GSAP 모션 실행 함수 */
			gsap.registerPlugin(ScrollTrigger); // 라이브러리 실행
			let mm = gsap.matchMedia(); 		// 미디어 쿼리
			fadeUpGsap(); 						// 페이드 업 실행 함수
			scaleGsap2();						// 스케일업 함수


			const pageTl 	 = gsap.timeline({});
			const pageHeader = document.querySelector('.page-header');
			const pageTit 	 = pageHeader.querySelectorAll('.page-tit .split-line span');

			const pageCont	 = document.querySelector('.page-content');

			gsap.set(pageTit, { yPercent: 150, autoAlpha: 0 }, 0);
			gsap.set(pageCont, { y: 30, autoAlpha: 0 })

			pageTl.to(pageTit,{
				yPercent: 0,
				autoAlpha: 1,
				duration: 1.2,
				ease: "cubic-bezier(0.22, 1, 0.36, 1)",
				stagger: 0.1,
				onComplete: () => {
					// 헤더효과
					//headerGsap();
					setTimeout( () => {
						if(window.lenis){
							// Lenis Lib 안전 하게 실행
							window.lenis.stop();
							window.lenis.start();
						}	
					}, 150);
				},
			})
			.to(pageCont,{
				y: 0,
				autoAlpha: 1,
				duration: 1,
				ease: "power2.out",
			}, "<")					// 페이드 업 실행 함수
			
			/* <TAB Swiper> */
			const tabSwiper = new Swiper("#swiperTab",{
				slidesPerView: 'auto',
				freeMode: true,
				spaceBetween: 4,
				slideToClickedSlide: true,
				breakpoints: {
					768: {
						slidesPerView: 'auto',
						spaceBetween: 8,
					},
				}
			});

	



			/* <GSAP Refresh> - 모션 초기화 */
			requestAnimationFrame(() => {
				ScrollTrigger.refresh(true);
			});
		});
		/* // [Document Ready] - DOM 로드 시 실행 함수 종료 */
		

		/* [Window Event] (Window) */
		/* Description: 이벤트 함수 */
		/* <Resizing> - 리사이징 */
		let resizeTimer;
		window.addEventListener('resize', function(){
			clearTimeout(resizeTimer);
			resizeTimer = setTimeout(() => {

				/* {GSAP Device Check} 디바이스 체크 */
				

				/* {GSAP Refresh} 모션 위치 감지,초기화 */
				requestAnimationFrame(() => {
					if(window.lenis){ 
						window.lenis.resize();
					}
					ScrollTrigger.refresh(true);
				});
			}, 120);
		});

		/* <Orientationchange> - 방향 전환 */
		window.addEventListener("orientationchange", () => {
			setTimeout(() => {
				if(window.lenis){ 
					window.lenis.resize();
				}
				window.ScrollTrigger?.refresh();
			}, 300);
		});
		/* // [Window Event] 이벤트 함수 종료 */
	</script>
