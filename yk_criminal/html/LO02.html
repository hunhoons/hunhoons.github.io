<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<meta name="format-detection" content="telephone=no">
	<title>YK 형사센터</title>
	<link type="text/css" rel="stylesheet" href="../@resource/css/yk.css">
	<link type="text/css" rel="stylesheet" href="../@resource/css/yk_dev.css">
	<script src="../@resource/js/lib/jquery-3.2.1.min.js"></script>
	<script src="../@resource/js/yk.js"></script>
</head>
<body>
	<div class="skip-nav"> <a href="#content">본문 바로가기</a> </div>
	<div id="wrap" class="wrap">
		<div id="container" class="sub join step2">
			<header id="header" class="header" data-include-path="../inc/header_sub.html"></header>

			<div id="content"> 
				<div class="gutter">
					<div class="content-header">
						<div class="title-wrap" data-aos="fade">
							<h2 class="page-title">
								회원가입 완료 <br>
								<span class="color-red">
									<span class="ff-inter">YK</span>의 회원이 되신 것을 <br> 축하드립니다!
								</span>
							</h2>
							<p class="text">
								회원가입이 완료되었습니다. <br>
								나만을 위한 법률 서비스를 경험해보세요.
							</p>
							<button class="btn color2 medium">로그인</button>
						</div>
					</div><!-- // content-header -->
				</div>
			</div>

			<!-- // #content -->
			<footer id="footer" class="footer" data-include-path="../inc/footer_sub.html"></footer>
		</div>
		<!-- // #container -->
	</div>
	<!-- // #wrap -->

<!-- 전체 공통 오픈 서치 팝업 -->
	<div id="popSearch" class="overlay pop-search">
		<div class="popup-body">
			<h2><span class="ff-inter">YK GPT</span>에 궁금한 <br class="only-mo"> 키워드를 검색해보세요</h2>
			<div class="search-wrap">
				<form action="">
					<fieldset>
						<div class="field">
							<div class="insert">
								<div class="input-wrap">
									<input type="search" name="" class="input-text data-search" placeholder="검색어를 입력해주세요.">
									<button type="button" class="btn clear" style="display: none;">
										<img src="../@resource/images/@uio/btn_delete.svg" alt="">
									</button>
								</div>
								<button type="button" class="btn search">
									<i class="ico search"></i>
								</button>
							</div>
						</div>
						<div class="search-box" style="display: none;">
							<!-- [D] 최대 6개 노출 -->
							<ul class="autocomplete">
								<li>
									<a href="javascript:void(0);">
										<span>성</span>추행
									</a>
								</li>
								<li>
									<a href="javascript:void(0);">
										<span>성</span>매매
									</a>
								</li>
								<li>
									<a href="javascript:void(0);">
										<span>성</span>희롱
									</a>
								</li>
								<li>
									<a href="javascript:void(0);">
										<span>성</span>범죄
									</a>
								</li>
								<li>
									<a href="javascript:void(0);">
										디지털<span>성</span>추행
									</a>
								</li>
								<li>
									<a href="javascript:void(0);">
										<span>성</span>추행 고소장
									</a>
								</li>
							</ul>
							<!-- // [D] 최대 6개 노출 -->
						</div>

						<div class="tag-wrap">
							<button type="button" class="btn tag">#형사전문변호사</button>
							<button type="button" class="btn tag">#강제추행</button>
							<button type="button" class="btn tag">#이혼전문변호사</button>
						</div>

						<div class="button-area">
							<button type="button" class="btn close bdr-color2 medium" onclick="modalClose('#popSearch')">
								닫기
							</button>
						</div>

					</fieldset>
				</form>
			</div>
		</div>
	</div>
	<!-- // 전체 공통 오픈 서치 팝업 -->
	<script src="../@resource/js/lib/aos.js"></script>
	<script src="http://pub.hanbom.com/@pub/@resource/js/hanbomIn.js"></script>
	<script>
	var includeCallback = function() {
		//includeCallback after
		
		nav.HeaderHref();
		nav.FooterNav();
		
	};
	AOS.init({
		easing: 'ease-out-quart',
		once: true,
		duration: 2500,
		offset: 100,
	});
	

	$(function(){

	});

	</script>
</body>
</html>
