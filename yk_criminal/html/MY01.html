	var includeCallback = function() {

	/* 다음 우편번호 */
	function daumPost(){
		new daum.Postcode({
			oncomplete : function(data){

				let addr = ''; // 주소 변수
            	let extraAddr = ''; // 참고항목 변수

					//사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
				if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
					addr = data.roadAddress;
				} else { // 사용자가 지번 주소를 선택했을 경우(J)
					addr = data.jibunAddress;
				}

				if(data.userSelectedType === 'R'){
					// 법정동명이 있을 경우 추가한다. (법정리는 제외)
					// 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
					if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
						extraAddr += data.bname;
					}
					// 건물명이 있고, 공동주택일 경우 추가한다.
					if(data.buildingName !== '' && data.apartment === 'Y'){
						extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
					}
					// 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
					if(extraAddr !== ''){
						extraAddr = ' (' + extraAddr + ')';
					}
				}

				// 우편번호와 주소 정보를 해당 필드에 넣는다.
				const address_1 = document.getElementById('edit-address').value = `${data.zonecode}`;
				const address_2 = document.getElementById("detail-address").value = `${addr}`;

				// 커서를 상세주소 필드로 이동한다.
				// address_2.focus();
			}

		}).open();
	}


	$(function(){

		// 아코디언
		accordion(1);

		// password 노출 / 비노출
		const pw_chk = $('.field.password .insert .btn.pw');
		pw_chk.each( (idx, item) => {
			let pw = false;
			$(item).click( () => {
				if(!pw){
					$(item).siblings('input').prop('type', 'text');
					$(item).addClass('hide');
					pw = true
				}else{
					$(item).siblings('input').prop('type', 'password');
					$(item).removeClass('hide');	
					pw = false;
				}
			});
		});

		function isPassword(pwValue) { // 패스워드 체크
			var regExp = /^(?=.*[a-zA-z])(?=.*[0-9])(?=.*[$`~!@$!%*#^?&\\(\\)\-_=+]).{8,16}$/;
			return regExp.test(pwValue);
		}
		
		$('#pwChkBtn').click( function(){
			if(!$('#date-pw').val()){
				$('#date-pw').focus();
				alert('기존 비밀번호를 입력해주세요.');
				return false;
			}
			// else if(){ // [D] 기존 비밀번호와 데이터 값이 맞는지 체크하는 스크립트 추가

			// }
		});

		$('#edit-pw2').on('input', function(){
			if($('#join-pw').val() === $('#join-pw2').val()){
				$('.field.password.pw2').removeClass('error');
			}
		});

		$('#btnMypageEdit').click( function(){
			const mypageEdit = $('.sub.mypage.edit #content'),
			inputPwChk = mypageEdit.find('.field.password .input-text'),
			inputTel = mypageEdit.find('.field.tel-wrap select.select, .field.tel-wrap [type="tel"]');

			inputPwChk.each( (idx, item) => {
				if(!$(item).val()){
					inputPwChk.eq(idx).focus();
					alert(inputPwChk.eq(idx).attr('data-title') + " 입력해주세요.");
					return false;
				}else if($('#edit-pw').val() !== $('#edit-pw2').val()){
					$('.field.password.pw2').addClass('error');
					$('#edit-pw2').focus();
					return false;
				}else if(isPassword($('#edit-pw').val()) != true){
					$('#edit-pw').focus();
					alert('영문 소문자 + 숫자 + 특수문자 8자 이상 입력해주세요.');
					return false;
				}else if(isPassword($('#edit-pw2').val()) != true){
					$('#edit-pw2').focus();
					alert('영문 소문자 + 숫자 + 특수문자 8자 이상 입력해주세요.');
					return false;
				}else if(!inputTel.val()){
					inputTel.focus();
					alert('휴대폰 인증을 해주세요.');
					return false;
				}else{
					const formMypageEdit = $('#formMypageEdit')[0];

					// $.ajax({
					// 	url : ,

					// 	},

					// });
				}
