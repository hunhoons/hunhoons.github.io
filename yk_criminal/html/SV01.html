	<script src="../@resource/js/lib/aos.js"></script>

	<script src="http://pub.hanbom.com/@pub/@resource/js/hanbomIn.js"></script>
	<script>
	var includeCallback = function() {
		//includeCallback after
		nav.current(2,1);
		nav.HeaderHref();
		nav.FooterNav();
		
	};
	AOS.init({
		easing: 'ease-out-quart',
		once: true,
		duration: 2500,
		offset: 100,
	});
	

	$(function(){

		$('.item-list.work-type input[type="radio"]').each( (idx, item) => {
			$(item).click( function(){
				if($(item).is(":checked")){
					$('.btn.next, .btn.complete').addClass('anis')
					if($(window).innerWidth() > 821){
						const documentHeight = $(window).innerHeight() / 2.5;
						$('html,body').animate( { scrollTop : documentHeight}, 600 );
					}else{
						const documentHeight = $('html,body').innerHeight() / 2.5;
						$('html,body').animate( { scrollTop : documentHeight}, 600 );
					}
				}
			});
		});


		$('#btnNextCate').click( function(){
			const cateStep = $('.sub.service.match-step1'),
			stepRadio = cateStep.find('.item-list.work-type [type="radio"]:checked');
			if(stepRadio.length > 0){
				location.href="SV01_02.html";
			}else{
				alert('분야를 선택해주세요.');
			}
		});

	});

	</script>
