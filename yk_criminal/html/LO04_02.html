<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<meta name="format-detection" content="telephone=no">
	<title>YK 형사센터</title>
	<link type="text/css" rel="stylesheet" href="../@resource/css/yk.css">
	<link type="text/css" rel="stylesheet" href="../@resource/css/yk_dev.css">
	<script src="../@resource/js/lib/jquery-3.2.1.min.js"></script>
	<script src="../@resource/js/yk.js"></script>
</head>
<body>
	<div class="skip-nav"> <a href="#content">본문 바로가기</a> </div>
	<div id="wrap" class="wrap">
		<div id="container" class="sub join change-pw">
			<header id="header" class="header" data-include-path="../inc/header_sub.html"></header>

			<div id="content"> 
				<div class="gutter">
					<div class="content-header">
						<div class="title-wrap" data-aos="fade">
							<h2 class="page-title">비밀번호 변경</h2>
							<p class="text">새로운 비밀번호를 설정해 주세요.</p>
						</div>
					</div><!-- // content-header -->

					<div class="content-body">
						<div class="form-wrap max-480">
							<form id="pwModify">
								<fieldset>
									<legend class="blind">비밀번호 변경</legend>

									<div class="field tel-wrap">
										<div class="label">
											<label for="join-tel">휴대폰번호</label>
										</div>
										<div class="insert tel">
											<div class="input-wrap">
												<select name="select_tel" id="selectTel" class="select medium">
													<option value="통신사" selected disabled>통신사</option>
													<option value="SKT">SKT</option>
													<option value="KT">KT</option>
													<option value="LG U+">LG U+</option>
													<option value="알뜰폰">알뜰폰</option>
												</select>
												<input type="tel" name="" class="input-text medium" id="join-tel" maxlength="13" onchange="numberMaxLength(this)" oninput="autoHyphen2(this)" data-title="휴대폰번호를">
												<button type="button" class="btn medium color1">
													인증번호요청
												</button>
											</div>
										</div>
										<div class="insert">
											<input type="number" class="input-text medium" placeholder="인증번호 입력 (5:00)" name="">
											<button type="button" class="btn color1 medium">
												인증번호확인
											</button>
										</div>
									</div>
	
									<div class="field">
										<div class="label">
											<label for="pw-change1">비밀번호</label>
										</div>
										<div class="insert">
											<input type="password" class="input-text medium" placeholder="비밀번호 입력" id="pw-change1" name="" data-title="비밀번호를">
										</div>
									</div>
	
									<!-- [D] 비밀번호 불 일치 시 .error 추가 -->
									<div class="field btn1 error">
										<div class="label">
											<label for="pw-change2">비밀번호 확인</label>
										</div>
										<div class="insert">
											<input type="password" class="input-text medium" placeholder="비밀번호 확인" id="pw-change2" name="" data-title="비밀번호를">
											<button type="button" class="btn color1 medium">확인</button>
										</div>
										<!-- 에러 문구 -->
										<p class="error-text">입력하신 비밀번호가 일치하지 않습니다.</p>
									</div>
									<!-- // [D] 비밀번호 불 일치 시 .error 추가 -->

									<div class="button-area">
										<button type="button" id="joinBtn" class="btn color1 medium">비밀번호 변경</button>
									</div>
	
									<div class="btn-util pack-center">
										<a class="btn text" href="LO03.html" role="button">아이디 찾기</a>
										<a class="btn text" href="LO00.html" role="button">로그인하기</a>
									</div>

								</fieldset>
							</form>
						</div>
					</div><!-- // content-body -->
				</div>
			</div>

			<!-- // #content -->
			<footer id="footer" class="footer" data-include-path="../inc/footer_sub.html"></footer>
		</div>
		<!-- // #container -->
	</div>
	<!-- // #wrap -->

<!-- 전체 공통 오픈 서치 팝업 -->
	<div id="popSearch" class="overlay pop-search">
		<div class="popup-body">
			<h2><span class="ff-inter">YK GPT</span>에 궁금한 <br class="only-mo"> 키워드를 검색해보세요</h2>
			<div class="search-wrap">
				<form action="">
					<fieldset>
						<div class="field">
							<div class="insert">
								<div class="input-wrap">
									<input type="search" name="" class="input-text data-search" placeholder="검색어를 입력해주세요.">
									<button type="button" class="btn clear" style="display: none;">
										<img src="../@resource/images/@uio/btn_delete.svg" alt="">
									</button>
								</div>
								<button type="button" class="btn search">
									<i class="ico search"></i>
								</button>
							</div>
						</div>
						<div class="search-box" style="display: none;">
							<!-- [D] 최대 6개 노출 -->
							<ul class="autocomplete">
								<li>
									<a href="javascript:void(0);">
										<span>성</span>추행
									</a>
								</li>
								<li>
									<a href="javascript:void(0);">
										<span>성</span>매매
									</a>
								</li>
								<li>
									<a href="javascript:void(0);">
										<span>성</span>희롱
									</a>
								</li>
								<li>
									<a href="javascript:void(0);">
										<span>성</span>범죄
									</a>
								</li>
								<li>
									<a href="javascript:void(0);">
										디지털<span>성</span>추행
									</a>
								</li>
								<li>
									<a href="javascript:void(0);">
										<span>성</span>추행 고소장
									</a>
								</li>
							</ul>
							<!-- // [D] 최대 6개 노출 -->
						</div>

						<div class="tag-wrap">
							<button type="button" class="btn tag">#형사전문변호사</button>
							<button type="button" class="btn tag">#강제추행</button>
							<button type="button" class="btn tag">#이혼전문변호사</button>
						</div>

						<div class="button-area">
							<button type="button" class="btn close bdr-color2 medium" onclick="modalClose('#popSearch')">
								닫기
							</button>
						</div>

					</fieldset>
				</form>
			</div>
		</div>
	</div>
	<!-- // 전체 공통 오픈 서치 팝업 -->
	<script src="../@resource/js/lib/aos.js"></script>
	<script src="http://pub.hanbom.com/@pub/@resource/js/hanbomIn.js"></script>
	<script>
	var includeCallback = function() {
		//includeCallback after
		
		nav.HeaderHref();
		nav.FooterNav();
		
	};
	AOS.init({
		easing: 'ease-out-quart',
		once: true,
		duration: 2500,
		offset: 100,
	});
	

	$(function() {

		// 아코디언
		accordion(1);

		// password 노출 / 비노출
		const pw_chk = $('.field.password .insert .btn.pw');
		pw_chk.each( (idx, item) => {
			let pw = false;
			$(item).click( () => {
				if(!pw){
					$(item).siblings('input').prop('type', 'text');
					$(item).addClass('hide');
					pw = true
				}else{
					$(item).siblings('input').prop('type', 'password');
					$(item).removeClass('hide');	
					pw = false;
				}
			});
		});

	});

	</script>
</body>
</html>
