<head>
	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<meta name="format-detection" content="telephone=no">
	<title>ASCEN</title>

	<!-- Open Graph (카카오, 페북, 슬랙 등) -->
	<meta property="og:type" content="website">
	<meta property="og:title" content="ASCEN">
	<meta property="og:description" content="ASCEN">
	<meta property="og:image" content="../@resource/images/opengraph.jpg">
	<meta property="og:url" content="">

	<!-- Twitter 카드 -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="ASCEN">
	<meta name="twitter:description" content="ASCEN">
	<meta name="twitter:image" content="../@resource/images/opengraph.jpg">

	<link rel="icon" href="../@resource/images/favicon.svg" sizes="any">
	<link rel="apple-touch-icon" sizes="192x192" href="../@resource/images/favicon.svg">

	<link rel="stylesheet" href="../@resource/css/ascen.css">
	<link rel="stylesheet" href="../@resource/css/ascen_dev.css">
	<script src="../@resource/js/lib/jquery-3.2.1.min.js"></script>
	<script src="../@resource/js/ascen.js"></script>
</head>
<body>
	

	<div id="wrap" class="wrap">
		<div id="container" class="container">
			<header id="header" class="header" data-include-path="../inc/header.html"></header>

			<!-- [D] 헤더 화이트 사용 시 : content에 header-white 클래스 추가 -->
			<main id="content" class="sub others error">
				<section class="section error">
					<div class="actions-wrap pack-down items-center gap-40-32">
						<div class="title-wrap pack-down items-center ta-c">
							<p class="page-txt fs-40-20 lh125">
								<span class="split">
									<span>OOPS! 404 Error!</span>
								</span>
							</p>
							<h2 class="page-tit fs-80-32 lh125 fw700">
								<span class="split">
									<span>Page Not Found</span>
								</span>
							</h2>
						</div>
						<div class="button-wrap center">
							<a href="../html/MA-0010.html" class="btn inquiry line-b large r100 lh100">
								<strong>Back To <span class="underline">Home</span></strong>
							</a>
						</div>
					</div>

					<div class="error-wrap">
						<h3 class="title">
							<strong>404</strong>
						</h3>
					</div>

					
					<div>

				</div>

				</section>
			</main>

			<footer id="footer" class="footer" data-include-path="../inc/footer.html"></footer>
		</div>
	</div>

	<!-- [JS] (Project JS Module) -->
	<script src="../@resource/js/lib/imagesloaded.min.js"></script>
	<script src="../@resource/js/lib/swiper-bundle.min.js"></script>

	<script src="../@resource/js/lib/gsap.min.js"></script>
	<script src="../@resource/js/lib/ScrollTrigger.min.js"></script>
	<script src="../@resource/js/lib/lenis.min.js"></script>
	<script>

		/* {isLayoutPath} - 레이아웃 불러오기 */
		typeof isLayoutPath === 'function' ? isLayoutPath(function(){ isCurrent(0); }) : isCurrent(0);

		/* [Document Ready] (DOM) */
		/* Description: DOM 로드 시 실행 함수 */
		$(function(){

			/* <Brower Evnet> - 로드 후 이벤트 */
			const body = document.body;
			body.classList.remove('loaded'); // 있다면 초기화 후
			body.classList.add('loaded'); 	 // 초기화 이후 로드

			/* <Scroll Reset> - 스크롤 새로고침 */
			//isScrollResetLenis();

			/* <Lenis Scroll Stop> - Lenis Scroll 초기 정지 */
			window.lenis.stop();
			

			/* {GSAP Lib} - GSAP 모션 실행 함수 */
			gsap.registerPlugin(ScrollTrigger); // 라이브러리 실행
			let mm = gsap.matchMedia(); 		// 미디어 쿼리
			fadeUpGsap(); 						// 페이드 업 실행 함수
			footerGsap();						// 푸터 모션


			/* <Header GSAP> - 헤더 모션 실행 후 스크롤 시작 */
			const pageTl  	= gsap.timeline({});
			
			const pageTit 	= $('.page-tit .split span');
			const pageTxt 	= $('.page-txt .split span');
			const pageBtn 	= $('.button-wrap');
			const errorTit 	= $('.error-wrap .title');

			gsap.set([pageTit,pageTxt,pageBtn], { yPercent: 105, autoAlpha: 0 });
			gsap.set(errorTit, { filter: 'blur(10px)', scale: 0.8, })

			pageTl.to([pageTit, pageTxt, pageBtn],{	// 페이지 타이틀
				yPercent: 0,
				autoAlpha: 1,
				duration: 1.2,
				ease: "cubic-bezier(0.22, 1, 0.36, 1)",
				stagger: 0.1,
				onComplete: () => {
					// 헤더효과
					headerGsap();
					setTimeout( () => {
						if(window.lenis){
							// Lenis Lib 안전 하게 실행
							window.lenis.stop();
							window.lenis.start();
						}	
					}, 50);
				}
			}).to(errorTit, {
				filter: 'blur(0px)', 
				scale: 1,
				duration: 1.25,
				// ease: "power4.out"
			},"<");


			const sectionError = document.querySelector('.section.error');
			gsap.to(errorTit, {
				scrollTrigger: {
					trigger: sectionError,
					start: 'top top',
					end: 'bottom center',
					scrub: true,
					//markers: true,
				},
				yPercent: -20,
				ease: 'none'
			});
		


			/* <GSAP Refresh> - 모션 초기화 */
			requestAnimationFrame(() => {
				ScrollTrigger.refresh(true);
			});
		});
		/* // [Document Ready] - DOM 로드 시 실행 함수 종료 */
		
		
		/* [Window Event] (Window) */
		/* Description: 이벤트 함수 */
		/* <Resizing> - 리사이징 */
		let resizeTimer;
		window.addEventListener('resize', function(){
			clearTimeout(resizeTimer);
			resizeTimer = setTimeout(() => {

				/* {GSAP Device Check} 디바이스 체크 */
				

				/* {GSAP Refresh} 모션 위치 감지,초기화 */
				requestAnimationFrame(() => {
					if(window.lenis){ 
						window.lenis.resize();
					}
					ScrollTrigger.refresh(true);
				});
			}, 120);
		});

		/* <Orientationchange> - 방향 전환 */
		window.addEventListener("orientationchange", () => {
			setTimeout(() => {
				if(window.lenis){ 
					window.lenis.resize();
				}
				window.ScrollTrigger?.refresh();
			}, 300);
		});
		/* // [Window Event] 이벤트 함수 종료 */
	</script> 

</body>
</html>
