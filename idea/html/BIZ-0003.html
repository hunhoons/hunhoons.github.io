<script src="../@resource/js/lib/gsap.min.js"></script>
<script src="../@resource/js/lib/ScrollTrigger.min.js"></script>
<script src="../@resource/js/lib/lenis.min.js"></script>
<script>
	/* Comment () => [Local isCurrent] 로컬에서만 isCurrent 사용 */
	isLayoutPath(function(){
		isCurrent(2,1);
	});

	$(function(){

		/* Commtent () => [Page Load Common] 로드 시 공통 */
		
		/* [Body Load] 로드 후 실행 */
		$('body').removeClass('loaded'); // 있다면 초기화 후
		$('body').addClass('loaded');

		/* [Scroll Reset] 새로고침 시 스크롤 초기화 */
		setLenisScrollReset();


		/* [GSAP Media Match] 미디어 매치 변수 */
		let mm;
		

		/* Comment () => [GSAP Motion Common] GSAP 모션 실행을 위한 로드 */
		$(document).ready(function(){

			/* [GSAP Lib] GSAP 라이브러리 싱행 */
			gsap.registerPlugin(ScrollTrigger);

			/* [GSAP Leins Scroll] Leins Scroll Smooth 전역 변수 */
			window.lenis.stop(); // 스크롤 막기

			/* [Page Header] 페이지 헤더 */
			const pageTit = $('.page-title .split span');
			const pageLab = $('.page-label span');

			// Page Header Setting, 타이틀&텍스트 세팅
			gsap.set([pageTit, pageLab], { yPercent: 105, autoAlpha: 0 });

			gsap.to(pageTit,{
				yPercent: 0,
				autoAlpha: 1,
				duration: 1.2,
				ease: "elastic.inOut(1,0.75)",
				stagger: 0.1,
				onComplete: () => {
					// 헤더효과
					headerGsap();
					setTimeout( () => {
						if(window.lenis){
							// Lenis Lib 안전 하게 실행
							window.lenis.stop();
							window.lenis.start();
						}	
					}, 50);
				}
			})
			gsap.to(pageLab,{ 
				yPercent: 0,
				autoAlpha: 1,
				duration: 1.2,
				ease: "elastic.inOut(1,0.75)",
			},"<0.3")
			

			/* [Page Content Motion] 페이지 콘텐츠 모션 */
			mm = gsap.matchMedia();

			/* [Page Content] 페이지 콘텐츠 */
				const pageCont = $('.page-content');

			// Page Content Setting, 로드 전 페이지 콘텐츠
			gsap.set(pageCont,{ y: 60, autoAlpha: 0 });
			gsap.to(pageCont,{
				y: 0,
				autoAlpha: 1,
				duration: 2,
				ease: 'power4.out',
				onStart: () => {
					fadeUpGsap();
					setTimeout( () => {
						ScrollTrigger.refresh(true);
					}, 100)
				}
			}, "<0.3");

			/* [GSAP Refresh] 모션 위치 감지,초기화 */
			ScrollTrigger.refresh(true);
		});


		/* Comment () => [Resize] GSAP, Window 반응형 대응 */
		$(window).on('resize', function(){

			/* [GSAP Media Match] 미디어 매치 체크 */
			// if(mm) mm.revert();

			/* [GSAP Refresh] 모션 위치 감지,초기화 */
			ScrollTrigger.refresh(true);
		});

	});
</script>
