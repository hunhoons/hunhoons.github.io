	<script>
		/* {GSAP Lib} - 이 페이지에서 사용하는 GSAP 플러그인 */
		gsap.registerPlugin(ScrollTrigger, SplitText);
		let mm = gsap.matchMedia();

		/*
			숨기는 것은 body가 보이기 전에 즉시, 재생(최초 진입 모션)만 나중에(loaded 이후) 해야 한다.
			titlesGsap/fieldGsap가 세팅하는 것과 동일한 시작 상태를 미리 걸어둔다.
			(titlesGsap/fieldGsap 자체나 스텝 이동 로직은 그대로 - 최초 진입 타이밍만 조정)
		*/
		gsap.set(['#typeNum', '#pageTit', '#pageSub', '#pageTxt'], { y: 40, autoAlpha: 0 });
		gsap.set(['.field-area', '.form-buttons'], { y: 40, autoAlpha: 0 });

		let startWeekendsIntro = () => {}; // $(function(){...}) 안에서 실제 함수로 연결됨

		/* {isLayoutReady} - header/footer include 완료 뒤 실행 */
		function isLayoutReady() {
			/* <Nav Current> */
			isCurrent(5);

			/* <Layout GSAP Motions> */
			headerGsap();
			footerGsap();

			/*
				include로 삽입된 header/footer의 실제 높이가 브라우저에 반영된 다음,
				Lenis와 ScrollTrigger의 최초 위치를 한 번만 측정한다.
			*/
			requestAnimationFrame(() => {
				window.lenis?.resize();
				ScrollTrigger.refresh();
				document.body.classList.add('loaded');
				window.lenis?.start();

				// body 페이드인(opacity 0.8s)이 끝나는 시점에 맞춰 최초 진입 모션 시작
				document.body.addEventListener('transitionend', function onLoadedFade(e) {
					if (e.target !== document.body || e.propertyName !== 'opacity') return;
					document.body.removeEventListener('transitionend', onLoadedFade);
					startWeekendsIntro();
				});
				setTimeout(startWeekendsIntro, 900); // 폴백: transitionend를 못 받았을 때
			});
		}

		/* {Lenis} - 초기 멈춤 */
		window.lenis?.stop();

		/* {isLayoutReady} - 함수 실행 */
		typeof isLayoutPath === 'function'
			? isLayoutPath(isLayoutReady)
			: isLayoutReady();

		/* [Document Ready] (DOM) */
		/* Description: DOM 로드 시 실행 함수 */
		$(function () {
			
			const page = document.querySelector('.sub.weekends');
			const weekends = {};

			/* Layouts */
			weekends.header = document.querySelector('.page-header'); // Page Header
			weekends.content = document.querySelector('.page-content'); // Page Content
			weekends.aside = document.querySelectorAll('.step-aside .tag'); // Page Aside

			/* Titles */
			weekends.tit = document.querySelector('#pageTit'); // Title
			weekends.sub = document.querySelector('#pageSub'); // Sub Title
			weekends.txt = document.querySelector('#pageTxt'); // Text
			weekends.num = document.querySelector('#typeNum'); // Type Number

			/* Forms */
			weekends.fieldArea = document.querySelector('.field-area'); // Field Wrapper
			weekends.field = document.querySelectorAll('.field-wrap'); // Field Wrapper
			weekends.checkable = document.querySelectorAll('.checkable-wrap'); // Checkable Wrapper

			/* Buttons */
			weekends.prev = document.querySelector('#prevBtn'); // Prev Button
			weekends.next = document.querySelector('#nextBtn'); // Next Button
			weekends.config = document.querySelector('#configBtn'); // Submit Button

			weekends.formButtons = document.querySelector('.form-buttons'); // 문의 Button Form
			weekends.compButtons = document.querySelector('.comp-buttons'); // 완료 Button Form

			/*  File Upload */
			weekends.file = document.querySelector('#fileUpload'); // Input File
			weekends.name = document.querySelector('#fileName'); // Input File Name
			weekends.nametag = document.querySelector('#fileNameTag'); // File Name
			weekends.fileup = document.querySelector('#fileUpBtn'); // File Upload Button
			weekends.filedel = document.querySelector('#fileDelBtn'); // File Delete Button

			/* Titles Data Object */
			const obj = [
				{
					number: '01',
					title: 'Monday',
					subTitle: '어떤 프로젝트를/만들고 싶으신가요?',
					text: '프로젝트 유형을 선택해주세요!',
				},
				{
					number: '02',
					title: 'Tuesday',
					subTitle: '어디에서 만나볼까요?',
					text: '미팅 장소를 선택해주세요!',
				},
				{
					number: '03',
					title: 'Wednesday',
					subTitle: '언제 시작할까요?',
					text: '프로젝트 일정을 선택해주세요!',
				},
				{
					number: '04',
					title: 'Thursday',
					subTitle: '무엇을 만들어내고/싶으신가요?',
					text: '프로젝트 형태를 선택해주세요!',
				},
				{
					number: '05',
					title: 'Friday',
					subTitle: '의뢰하시는 분의/정보를 알려주세요!',
					text: '지금 만나러 가겠습니다!',
				},
				{
					number: '06',
					title: 'Weekends',
					subTitle: '문의가 완료되었습니다./이제 마음 편히 주말을 즐기세요.',
					text: '남은 고민은 저희에게 맡기시고 일상은 가볍게 누리세요./담당자가 내용을 확인한 후 빠르게 연락드리겠습니다.',
				},
			];

			// 현재 번호 체크
			let currentStep = 0;

				const FORM_STEP = weekends.checkable.length;
				const COMPLETE_STEP = obj.length - 1; // Weekends, 현재는 5
				let isScrolling = false;

			// Titles GSAP Motions
			function titlesGsap() {
				const titleItems = [
					weekends.num,
					weekends.tit,
					weekends.sub,
					weekends.txt,
				].filter(Boolean);

				gsap.killTweensOf(titleItems);

				gsap.set(titleItems, {
					y: 40,
					autoAlpha: 0,
				});

				gsap.to(titleItems, {
					y: 0,
					autoAlpha: 1,
					duration: 1.6,
					ease: 'elastic.out(0.55, 0.85)',
					stagger: 0.1,
				});
			}
			function fieldGsap(isComplete) {
				const buttonArea = isComplete
					? weekends.compButtons
					: weekends.formButtons;

				const motionItems = [
					weekends.fieldArea,
					buttonArea,
				].filter(Boolean);

				if (!motionItems.length) return;

				// 이전 모션 정리
				gsap.killTweensOf(motionItems);

				// 시작 상태
				gsap.set(motionItems, {
					y: 40,
					autoAlpha: 0,
				});

				// 타이틀과 같은 방향으로 등장
				gsap.to(motionItems, {
					y: 0,
					autoAlpha: 1,
					duration: 1.6,
					ease: 'elastic.out(0.55, 0.85)',
					stagger: 0.1,
				});
			}

			// Object Data Render
			function renderText(element, text) { // Br 처리
				if (!element) return;

				element.replaceChildren();

				text.split('/').forEach((line, lineIndex) => {
					if (lineIndex > 0) {
						element.append(document.createElement('br'));
					}

					element.append(document.createTextNode(line.trim()));
				});
			}

			function renderObj() {
				const data = obj[currentStep];
				if (!data) return;

				// 먼저 배열 데이터로 텍스트 변경
				weekends.num.querySelector('span').textContent = data.number;
				weekends.tit.querySelector('strong').textContent = data.title;

				renderText(weekends.sub.querySelector('span'), data.subTitle);
				renderText(weekends.txt.querySelector('span'), data.text);

				// Field 노출
				renderField();

				// 현재 단계 체크
				const isFirstStep = currentStep === 0;
				const isFormStep = currentStep === FORM_STEP;
				const isComplete = currentStep === COMPLETE_STEP;

				weekends.prev.style.display = isFirstStep ? 'none' : 'flex'; // 이전 버튼 노출 여부
				weekends.next.style.display = isFormStep || isComplete ? 'none' : 'flex'; // 다음 버튼 노출 여부
				weekends.config.style.display = isFormStep ? 'flex' : 'none'; // 문의하기 버튼 노출 여부

				// 완료 단계에서만 완료 버튼 표시
				weekends.formButtons.style.display = isComplete ? 'none' : 'flex';
				weekends.compButtons.style.display = isComplete ? 'flex' : 'none';

				// 마지막 단계 클래스
				page.classList.toggle('is-complete', isComplete);

				// 현재 스탭 확인
				renderAside();

				// 텍스트 변경 후 타이틀 모션 다시 시작
				titlesGsap();

				fieldGsap(isComplete);
			}

			function renderAside() {
				weekends.aside.forEach((tag, index) => {
					tag.classList.remove('is-ing', 'is-comp');

					if (index === currentStep) {
						tag.classList.add('is-ing');
					} else if (index < currentStep) {
						tag.classList.add('is-comp');
					}
				});
			}

			function renderField() {
				weekends.field.forEach((field, fieldIndex) => {
					// 현재 단계의 field-wrap만 표시
					field.hidden = fieldIndex !== currentStep;
				});
			}

			// 폼 요소 검사
			function validateCurrentStep() {
				// Monday~Thursday: 체크박스 검증
				if (currentStep < weekends.checkable.length) {
					const currentWrap = weekends.checkable[currentStep];
					const checked = currentWrap.querySelector(
						'input[type="checkbox"]:checked'
					);

					if (!checked) {
						alert('항목을 한 개 이상 선택해주세요.');
						return false;
					}

					return true;
				}

				// Friday: 문의 폼 검증
				if (currentStep === FORM_STEP) {
					const requiredInputs = [
						{
							selector: '#userName',
							message: '이름을 입력해주세요.',
						},
						{
							selector: '#companyName',
							message: '회사명을 입력해주세요.',
						},
						{
							selector: '#userPhone',
							message: '연락처를 입력해주세요.',
						},
						{
							selector: '#userEmail',
							message: '이메일을 입력해주세요.',
						},
					];

					for (const item of requiredInputs) {
						const input = document.querySelector(item.selector);

						if (!input) {
							console.warn(`필수 입력 요소가 없습니다: ${item.selector}`);
							return false;
						}

						if (!input.value.trim()) {
							alert(item.message);
							input.focus();
							return false;
						}
					}

					const phone = document.querySelector('#userPhone');
					const email = document.querySelector('#userEmail');

					// 연락처 형식 검사
					const phoneNumber = phone.value.replace(/-/g, '').trim();

					if (!/^01[016789][0-9]{7,8}$/.test(phoneNumber)) {
						alert('올바른 연락처를 입력해주세요.');
						phone.focus();
						return false;
					}

					// 이메일 형식 검사
					if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
						alert('올바른 이메일을 입력해주세요.');
						email.focus();
						return false;
					}
				}

				return true;
			}

				function getHeaderHeight() {
					return weekends.header?.getBoundingClientRect().height || 0;
				}

				// 높이 변경 후 Lenis·ScrollTrigger 갱신
				function refreshLayout() {
					requestAnimationFrame(() => {
						window.lenis?.resize();
						window.ScrollTrigger?.refresh();
					});
				}

				// Next·Prev용: PC·모바일 모두 최상단 0
				function scrollToTop(onComplete) {
					if (isScrolling) return;
					isScrolling = true;

					let finished = false;
					let timer;
					let scrollEndHandler;

					const finish = () => {
						if (finished) return;
						finished = true;
						clearTimeout(timer);
						if (scrollEndHandler) {
							window.removeEventListener('scrollend', scrollEndHandler);
						}
						isScrolling = false;
						refreshLayout();
						onComplete?.();
					};

					if (window.lenis) {
						window.lenis.scrollTo(0, {
							duration: 0.8,
							immediate: false,
							onComplete: finish,
						});

						// Lenis 완료 이벤트가 누락될 때를 위한 예외 처리
						timer = setTimeout(finish, 1000);
						return;
					}

					window.scrollTo({ top: 0, behavior: 'smooth' });

					// 기본 window scroll에는 완료 콜백이 없으므로 한 번만 감지
					scrollEndHandler = finish;
					window.addEventListener('scrollend', scrollEndHandler, { once: true });
					timer = setTimeout(finish, 1000);
				}

			// 체크박스용: page-content 위치로 이동
			function scrollToContent() {
				if (!weekends.content) return;

				const contentRect = weekends.content.getBoundingClientRect();
				const headerHeight = getHeaderHeight();
									const targetPosition = Math.max(
						0,
						contentRect.top + window.scrollY - headerHeight
					);

					if (isScrolling) return;
					isScrolling = true;

					let finished = false;
					const finish = () => {
						if (finished) return;
						finished = true;
						isScrolling = false;
						refreshLayout();
					};

					if (window.lenis) {
						window.lenis.scrollTo(targetPosition, {
							duration: 1.4,
							immediate: false,
							onComplete: finish,
						});
						setTimeout(finish, 1600);
						return;
					}

					window.scrollTo({ top: targetPosition, behavior: 'smooth' });
					if ('onscrollend' in window) {
						window.addEventListener('scrollend', finish, { once: true });
					}
					setTimeout(finish, 1600);

			}

			/* File Upload Event */
			function resetFile() {
				if (weekends.file) weekends.file.value = '';
				if (weekends.name) weekends.name.value = '';

				if (weekends.nametag) {
					weekends.nametag.innerHTML =
						'<strong>(선택)</strong> 첨부파일을 업로드해주세요.';
				}

				weekends.fileup?.classList.remove('active', 'd-none');
				weekends.filedel?.classList.add('d-none');
			}

			if (weekends.fileup && weekends.file) {
				weekends.fileup.addEventListener('click', () => {
					weekends.file.click();
				});

				weekends.file.addEventListener('change', () => {
					const file = weekends.file.files?.[0];
					if (!file) return;

					if (weekends.name) {
						weekends.name.value = file.name;
					}

					if (weekends.nametag) {
						weekends.nametag.textContent = file.name;
					}

					weekends.fileup.classList.add('active', 'd-none');
					weekends.filedel?.classList.remove('d-none');
				});
			}

			if (weekends.filedel) {
				weekends.filedel.addEventListener('click', (event) => {
					event.preventDefault();
					event.stopPropagation();
					resetFile();
				});
			}

			// Prev Button Click Event
			function prevBtnEvent() {
				if (isScrolling || currentStep <= 0) return;

									currentStep -= 1;
					scrollToTop(() => {
						renderObj();
						refreshLayout();
					});

			}

			// Next Button Click Event
			function nextBtnEvent() {
					if (isScrolling) return;
					if (!validateCurrentStep()) return;

				// 마지막 단계에서는 더 이상 증가하지 않음
				if (currentStep >= FORM_STEP) return;

									currentStep += 1;
					scrollToTop(() => {
						renderObj();
						refreshLayout();
					});

			}

			// Config Button Click Event
			function configBtnEvent() {
					if (isScrolling) return;
					if (!validateCurrentStep()) return;

									alert('문의가 완료되었습니다.');

					// alert를 확인한 뒤 완료 단계로 이동
					currentStep = COMPLETE_STEP;
					scrollToTop(() => {
						renderObj();
						refreshLayout();
					});

			}

			weekends.checkable.forEach((wrap) => {
				wrap.addEventListener('change', (event) => {
					if (!event.target.matches('input[type="checkbox"]')) return;

					scrollToContent();
				});
			});

			weekends.prev?.addEventListener('click', prevBtnEvent); // Prev Button Click
			weekends.next?.addEventListener('click', nextBtnEvent); // Next Button Click
			weekends.config?.addEventListener('click', configBtnEvent); // Config Button Click

			// 최초 실행 (body 페이드인이 끝난 뒤 시작 - isLayoutReady 쪽에서 startWeekendsIntro()를 호출)
			let introStarted = false;
			startWeekendsIntro = () => {
				if (introStarted) return;
				introStarted = true;

				resetFile();
				renderObj();
				refreshLayout();
			};

		});


		/* // [Document Ready] - DOM 로드 시 실행 함수 종료 */
	</script>

</body>
</html>
