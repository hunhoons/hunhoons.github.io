		<div id="container" class="container">
			<header id="header" class="header" data-include-path="../inc/header.html"></header>

			<div id="locations" class="location-wrap">
				<!-- [D] LocationGnb() 함수 사용 -->
			</div>
			<!-- // locations -->

			<div id="content" class="sub contact">
				<div class="gutter">
					<div class="page-content">

						<div class="side-area">
							<aside id="aside" class="aside">
								<div class="sticky-wrap">
									<h2 class="lnb-title"> 상담신청 </h2>
								</div>
							</aside>
							<!-- // aside -->
	
							<div class="content-wrap">
								<div class="title-wrap">
									<h3 class="title">
										당신의 고민, <br>
										디센트 법률사무소가 <br class="only-mo">
										함께합니다.
									</h3>
								</div>

								<div class="form-wrap">
									<form id="dataForm">
                                        <fieldset>
                                            <legend class="blind"> 문의하기 </legend>
											<div class="contact-wrap">

												<!-- [D] 현재 step에 클래스 active 추가 -->
												<div id="step1" class="step-wrap">
													<div class="step-box">
														<span class="step">01</span>
														<h4 class="title">
															의뢰인 정보를 알려주세요.
														</h4>
														<p class="text">
															문의하신 사항에 회신드리기 위한 <br class="only-mo">
															기본 정보를 작성해 주세요.
														</p>
													</div>
													<div class="form-box">
														<span class="required"><span>*</span> 
															필수 입력 항목입니다.
														</span>
	
														<div class="field">
															<label for="userName" class="label">성명 <span>*</span></label>
															<input type="text" id="userName" class="input-text large" placeholder="성함을 입력해 주세요">
														</div>
														<div class="field">
															<label for="userTel" class="label">연락처 <span>*</span></label>
															<input id="userTel" type="tel" class="input-text large" placeholder="000-0000-0000" oninput="autoHyphen(this);" maxlength="13">
														</div>
														<div class="check-wrap">
															<input type="checkbox" id="userPrivacy" name="" class="checkbox" >
															<label for="userPrivacy" class="label"> 
																개인정보수집동의 <a href="./FOO-0001.html" target="_blank">전문보기</a>
															</label>
														</div>
													</div>
												</div>
												<!-- // #step1 -->

												<div id="step2" class="step-wrap">
													<div class="step-box">
														<span class="step">02</span>
														<h4 class="title"> 상담 내용 </h4>
														<p class="text"> 남기실 말씀을 알려주세요. </p>
													</div>
	
													<div class="form-box">
														<div class="field">
															<label for="userContent" class="label">상담내용</label>
															<textarea name="" id="userContent" class="textarea" placeholder="상담내용을 입력해 주세요"></textarea>
														</div>
													</div>
												</div>
												<!-- // #step2 -->
	
												<div id="step3" class="step-wrap">
													<div class="step-box">
														<span class="step">03</span>
														<h4 class="title"> 유입경로 </h4>
														<p class="text"> 
															어떻게 디센트법률사무소를 알게되었나요?
															<span>(다중 선택 가능)</span>
														</p>
													</div>
													<div class="form-box">
														<div class="check-area">
															<div class="check-wrap">
																<input type="checkbox" id="userUrl-1" name="" class="checkbox" value="naverSearch">
																<label for="userUrl-1" class="label"> 
																	네이버 검색
																</label>
															</div>
															<div class="check-wrap">
																<input type="checkbox" id="userUrl-3" name="" class="checkbox" value="naverBlog">
																<label for="userUrl-3" class="label"> 
																	네이버 블로그
																</label>
															</div>
															<div class="check-wrap">
																<input type="checkbox" id="userUrl-5" name="" class="checkbox" value="naverExpert">
																<label for="userUrl-5" class="label"> 
																	네이버 엑스퍼트
																</label>
															</div>
															<div class="check-wrap">
																<input type="checkbox" id="userUrl-7" name="" class="checkbox" value="lawTalk">
																<label for="userUrl-7" class="label"> 
																	로톡
																</label>
															</div>
														</div>
														<div class="check-area">
															<div class="check-wrap">
																<input type="checkbox" id="userUrl-2" name="" class="checkbox" value="lawandGood">
																<label for="userUrl-2" class="label"> 
																	로앤굿
																</label>
															</div>
															<div class="check-wrap">
																<input type="checkbox" id="userUrl-4" name="" class="checkbox" value="pressRelease">
																<label for="userUrl-4" class="label"> 
																	언론보도
																</label>
															</div>
															<div class="check-wrap">
																<input type="checkbox" id="userUrl-6" name="" class="checkbox" value="sns">
																<label for="userUrl-6" class="label"> 
																	SNS
																</label>
															</div>
															<div class="check-wrap">
																<input type="checkbox" id="userUrl-8" name="" class="checkbox" value="recommend">
																<label for="userUrl-8" class="label"> 
																	지인추천
																</label>
															</div>
														</div>
														<div class="check-wrap">
															<input type="checkbox" id="userUrl-9" name="" class="checkbox" value="etc">
															<label for="userUrl-9" class="label"> 
																기타
															</label>
															<input type="text" class="input-text large" placeholder="내용을 입력해주세요." id="userUrlEtc" disabled> 
														</div>		
													</div>
												</div>
												<!-- // #step3 -->

												<div id="step4" class="step-wrap active">
													<div class="form-box">
														<div class="title-wrap">
															<h3 class="title">상담이 접수되었습니다!</h3>
															<p class="text">
																신속한 확인 후, 담당 변호사가 <br class="only-mo">
																직접 연락드리겠습니다.
															</p>
														</div>
														<div class="text-wrap">
															<p class="text">
																상담 내용과 관련된 <br class="only-mo">
																모든 정보의 비밀을 보장합니다.
															</p>
														</div>
													</div>
												</div>
												<!-- // #step4 -->

											</div> 
										</fieldset>
									</form>

									<div class="button-wrap">
										<button type="button" class="btn large bdr-color2 w-100 next"> 다음 </button>
										<button type="button" class="btn large color2 complete"> 상담신청하기 </button>
										<a href="/" class="btn large color2 home active"> 홈 바로가기 </a>
									</div>	

								</div>

							</div>
							<!-- // content-wrap  -->
						</div>

					</div>
				</div>
			</div><!-- // #content -->

			<footer id="footer" class="footer" data-include-path="../inc/footer.html"></footer>
		</div><!-- // #container -->
	</div><!-- // #wrap -->


	<script src="../@resource/js/lib/jquery.mCustomScrollbar.concat.min.js"></script>
	<script src="../@resource/js/lib/swiper-bundle.min.js"></script>
	<script src="../@resource/js/lib/aos.js"></script>
	<script src="http://pub.hanbom.com/@pub/@resource/js/hanbomIn2023.js"></script>
	<script>
		var includeCallback = function(e){
			if (e == '_header_wsg.html') {
				nav.headerChange();
			}
			if (e == '_nav_wsg.html') {
				nav.current(0,0);
			} 
		};

		AOS.init({
			easing: 'ease-out-back',
			duration: 1500,
		});

		$(function(){
			includeCallback();
			// locations
			$('#locations').append(LocationGnb('./CON-0001.html','상담신청'));


	
			$('.btn.next').click( function(){ // step1 && step2

				if($('#step1').hasClass('active')){
					if($('#userName').val() == ""){
						alert('성명을 입력하세요.');
						$('#userName').focus();
						return false;
					}
					if($('#userTel').val() == ""){
						alert('연락처를 입력하세요.');
						$('#userTel').focus();
						return false;
					}

					if($('#userTel').val().length < 13){
						alert(`잘못된 양식입니다. \n연락처를 다시 입력해주세요.`);
						$('#userTel').focus();
						return false;
					}

					if($('#userPrivacy').is(':checked') == false){
						alert('개인정보수집에 동의하여주세요.');
						return false;
					}
					$('#step1').removeClass('active');
					$('#step2').addClass('active');
					

				}else if($('#step2').hasClass('active')){
					$('#step2').removeClass('active');
					$('#step3').addClass('active');
					$('.btn.next').removeClass('active');
					$('.btn.complete').addClass('active');
				}
			});


			let checkArr = [];
			$('#step3 input[type="checkbox"]').each( (idx, item) => {
				$(item).click( function(){
					if($(item).is(':checked')){
						checkArr.push($(item).val());
						if($(item).val() == 'etc'){
							$('#userUrlEtc').prop('disabled', false);
						}
					}else{
						checkArr = checkArr.filter((value) => value !== $(item).val());
						if($(item).val() == 'etc'){
							$('#userUrlEtc').val("");
							$('#userUrlEtc').prop('disabled', true);
						}
					}
				})
			})

			$('.btn.complete').click( function(){
				if($('#step3').hasClass('active')){

					//  

					if($('#userUrl-9').is(':checked') ==  true){
						if($('#userUrlEtc').val() == "" || $('#userUrlEtc').val() == null){
							alert('기타 내용을 입력해주세요.');
							$('#userUrlEtc').focus();
							return false;
						}
					}else{

					}
				}

				// data 전송 폼 이후 아래 처리

				$('#step3').removeClass('active');
				$('#step4').addClass('active');

				$('.btn.complete').removeClass('active');
				$('.btn.home').addClass('active');

				
			});
                
		});

	</script>
</body>
