	<!-- meta og -->

	<meta property="og:title" content="DECENT LAW FIRM | 디센트 법률사무소">
	<meta property="og:description" content="스타트업, 블록체인 전문 로펌 디센트 법률사무소입니다.">

	<link type="text/css" rel="stylesheet" href="../@resource/css/decent.css">
	<link type="text/css" rel="stylesheet" href="../@resource/css/decent_dev.css">
	<script src="../@resource/js/lib/jquery-3.2.1.min.js"></script>
	<script src="../@resource/js/decent.js"></script>
</head>
<body>
	<div class="skip-nav">
		<a href="#content">본문 바로가기</a>
	</div><!-- // .skip-nav -->



	<div id="wrap" class="wrap">
		<div id="container" class="container">
			<header id="header" class="header" data-include-path="../inc/header.html"></header>
			
			<!-- [D] 검색 결과가 없을 시 클래스 nodata 추가
								있을 시 클래스 nodata 삭제
			-->
			<div id="content" class="main search nodata">
				
				<div class="page-content">

					<section class="section search">
						<div class="gutter">
							
							<!-- [D] 검색어 유지 시 search-wrap 클래스 inputs 추가 -->
							<div class="search-wrap inputs">
								<div class="title-wrap">
									<h3 class="title">
										<span>‘말소’</span>에 대한 <br>
										검색 결과가 없습니다.
									</h3>
								</div>

								<form id="dataForm" class="form">
									<div class="input-box large">
										<input type="text" class="input-text" placeholder="검색어를 입력해주세요." value="말소">
										<div class="button-area">
											<button type="button" class="btn search-close">
												<i class="ico search-close"></i>
											</button>
											<button type="submit" class="btn search">
												<i class="ico search-3"></i>
											</button>
										</div>
									</div>
								</form>

							</div>

						</div>
					</section>

				</div>

			</div><!-- // #content -->
			
			<footer id="footer" class="footer" data-include-path="../inc/footer.html"></footer>
		</div><!-- // #container -->
	</div><!-- // #wrap -->


	<script src="../@resource/js/lib/swiper-bundle.min.js"></script>
	<script src="../@resource/js/lib/jquery.mCustomScrollbar.concat.min.js"></script>
	<script src="../@resource/js/lib/aos.js"></script>
	<script src="../@resource/js/lib/hanbomIn2023.js"></script>
	<script>

var includeCallback = function(e){
			nav.current(0,0);
		};

		AOS.init({
			easing: 'ease-out-back',
			duration: 1500,
		});

		$(function(){
			includeCallback();		

			// swipers
			const itemSwiper = $('.swiper.items');
			itemSwiper.each( function(idx, item){
				let Swipers = new Swiper ( item , {
					slidesPerView: 'auto',
					watchOverflow :true,
					spaceBetween: 8,
					scrollbar :{
						el: `.swiper-scrollbar`,
						//hide: true,
					},
					navigation: {
						nextEl: `.swiper-button-next`,
						prevEl: `.swiper-button-prev`,
					},
					breakpoints: {
						769: {
							spaceBetween: 16,
						},
						1260: {
							spaceBetween: 30,
						}
					},
				});
			});


			$(window).on('resize', function() {

				itemSwiper.init();
				itemSwiper.updateSize();
				itemSwiper.updateSlides();
			});

		});

	</script>
</body>
</html>
