	<script>
		var includeCallback = function(){
			nav.current(2, 1);
			nav.FooterNav();

		jQuery(function(){
			// 검색 자동완성 			
			autoComplete();

			// 센터 스와이퍼
			centerSwiper();

			function centerSwiper() {
				const breakpoint = window.matchMedia('(min-width:821px)');
				let moduleTab;

				const breakpointChecker = function () {
					if (breakpoint.matches === true) {
						if (moduleTab !== undefined) moduleTab.destroy(true, true);
					} else if (breakpoint.matches === false) {
						return enableSwiper();
					}
				};

				const enableSwiper = function () {
					moduleTab = new Swiper(".swiper.center", {
						slidesPerView: "1",
						spaceBetween: 24,
						centeredSlides: true,
						breakpoints: {
							821: {
								noSwiping: true,
								allowTouchMove: false,
							}
						},
						pagination: {
							el: ".swiper-pagination",
						},
					});
				};
				breakpoint.addListener(breakpointChecker);
				breakpointChecker();
			}
		});
	</script>
