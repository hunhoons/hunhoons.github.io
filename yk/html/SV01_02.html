	<script>
		var includeCallback = function(){

		jQuery(function(){
			const nextBtn_2 = $('.btn.next');
			const btnValue_2 = $('.match-type.type-2 .item-list input[type="radio"]');
			nextBtn_2.click( () => {
				if(btnValue_2.is(":checked") ==  true){
					location.href="SV01_03.html";
				}else{
					alert('사건를 선택해 주세요.');
				}
			});

			btnValue_2.each( (idx, item) => {
				$(item).click( () =>{
					if($(item).is(':checked') ==  true){
						const documentHeight = $('html,body').innerHeight() / 2.5;
						$('html,body').animate( { scrollTop : documentHeight}, 600 );
					}
				});
			});

		});
