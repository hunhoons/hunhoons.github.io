<!DOCTYPE html>
<html lang="ko">
	<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<meta name="format-detection" content="telephone=no">
	<title>법무법인 YK</title>
	<link type="text/css" rel="stylesheet" href="../@resource/css/lib/aos.css">
	<link type="text/css" rel="stylesheet" href="../@resource/css/yk.css">
	<link type="text/css" rel="stylesheet" href="../@resource/css/yk_dev.css">
	<script src="../@resource/js/lib/jquery-3.2.1.min.js"></script>
	<script src="../@resource/js/lib/aos.js"></script>
	<script src="../@resource/js/yk.js"></script>
</head>
<body>

	<div class="skip-nav">
		<a href="#content">본문 바로가기</a>
	</div>

	<div id="wrap" class="wrap">
		<div id="container" class="intellect match-type type-3">
			<header id="header" class="header" data-include-path="../inc/header.html"></header>

			<div id="content">
				<div class="location">
					<div class="inner">
						<a href="HM00.html" class="home" title="홈"><i class="ico home"></i></a>
						<a href="SV00.html">YK 서비스</a>
						<select name="" id="" class="select" onchange="if(this.value) location.href=(this.value)">
							<option value="SV00.html">변호인단 매칭</option>
							<option value="SV03.html">나의 사건 현황</option>
							<option value="SV04.html">법률지식인</option>
							<option value="SV07.html">법률 서식 다운​</option>
							<option value="SV11.html">YK수사본부</option>
						</select>
					</div>
				</div><!-- // location -->

				<div class="content-header">
					<div data-aos="fade-up">
						<div class="date-count">
							<span>03</span> / 03
						</div>
						<h1><span>형사</span> 사건에서 <br class="only-mo"> 내 입장은?</h1>
					</div>
				</div>  <!-- // content-header -->

				<div class="content-primary">
					<div class="max-1280">
						<ul class="item-list field col-2">
							<li>
								<input type="radio" id="position1" class="radio" name="position" value="1">
								<label class="item" for="position1">
									<div class="data-wrap">									
										<p class="title">고소인 / 피해자</p>
										<p class="text">가해자의 형사 처벌을 원하는 입장</p>
									</div>
								</label>
							</li>
							<li>
								<input type="radio" id="position2" class="radio" name="position" value="2">
								<label class="item" for="position2">
									<div class="data-wrap">									
										<p class="title">피고소인 / 가해자 (피의자/피고인)</p>
										<p class="text">형사 처벌 위기에 있는 입장</p>
									</div>
								</label>
							</li>
						</ul>

						<div class="btn-area large">
							<button type="button" class="btn prev bdr large" onclick="location.href='SV01_02.html'">이전으로</button>
							<button type="button" class="btn complete normal large" onclick="location.href='SV02.html'">다음으로</button>
						</div>
					</div>

				</div><!-- // content-primary -->

			</div><!-- // #content -->

			<footer id="footer" class="footer" data-include-path="../inc/footer.html"></footer>
		</div><!-- // #container -->
	</div><!-- // #wrap -->
	<div id="popSearch" class="overlay pop-search">
		<div class="popup-body">
			<h2><span class="ff-inter">YK GPT</span>에 궁금한 <br class="only-mo"> 키워드를 검색해보세요</h2>
			<div class="search-wrap">
				<form action="">
					<fieldset>
						<legend>검색</legend>
						<div class="input-wrap max-720">
							<input type="text" class="input-text large" placeholder="검색어를 입력해주세요.">
							<button type="button" class="btn search" title="검색">
								<i class="ico search-2"></i>
							</button>
							<button type="button" class="btn clear" title="삭제">
								<i class="ico delete"></i>
							</button>
						</div>
	
						<div class="search-bottom">
							<!-- [D] li max 6개 -->
							<ul class="autocomplete">
								<li><a href="javascript:void(0);"><strong>성</strong>추행</a></li>
								<li><a href="javascript:void(0);"><strong>성</strong>매매</a></li>
								<li><a href="javascript:void(0);"><strong>성</strong>희롱</a></li>
								<li><a href="javascript:void(0);"><strong>성</strong>범죄</a></li>
								<li><a href="javascript:void(0);">디지털 <strong>성</strong>범죄</a></li>
								<li><a href="javascript:void(0);"><strong>성</strong>추행 고소장</a></li>
							</ul>
							<!-- // [D] li max 6개 -->
							
						</div>
	
						<div class="tag-wrap">
							<span class="tag small">#형사전문변호사</span>
							<span class="tag small">#강제추행</span>
							<span class="tag small">#이혼전문변호사</span>
						</div>
						<button type="button" class="btn bdr-3 small btn-close">닫기</button>
					</fieldset>
				</form>
			</div>
		</div>
	</div>



	<script src="../@resource/js/lib/swiper-bundle.js"></script>
	<script src="http://pub.hanbom.com/@pub/@resource/js/hanbomIn.js"></script>
	<script src="../@resource/js/lib/jquery.nicescroll.min.js"></script>
	<script>
		var includeCallback = function(){
			// nav.current(1, 2);
			nav.FooterNav();
		};
		jQuery(function(){
			const nextBtn_3 = $('.btn.next');
			const btnValue_3 = $('.match-type.type-3 .item-list input[type="radio"]');
			nextBtn_3.click( () => {
				if(btnValue_3.is(":checked") ==  true){
					location.href="SV02.html";
				}else{
					alert('사건를 선택해 주세요.');
				}
			});

			btnValue_3.each( (idx, item) => {
				$(item).click( () =>{
					if($(item).is(':checked') ==  true){
						const documentHeight = $('html,body').innerHeight() / 2.5;
						$('html,body').animate( { scrollTop : documentHeight}, 600 );
					}
				});
			});

		});
	</script>
</body>
</html>
