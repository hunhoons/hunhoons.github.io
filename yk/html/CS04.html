						</a>

				<div class="content-primary">

						<fieldset>

							<div class="field">
								<div class="label flex space-between">
									회사명
								</div>
								<div class="insert input-wrap">
									<input type="text" class="input-text medium" placeholder="회사명 입력">

							<div class="field">

								</div>
							</div>

							<div class="field">
								<div class="label">휴대폰번호</div>
								<div class="insert input-wrap">
									<input type="number" oninput="maxLengthCheck(this)" maxlength="11" class="input-text medium" placeholder="숫자만 입력">
								</div>
							</div>

							<div class="field">
								<div class="label flex space-between">
									이메일

								<div class="insert input-wrap">

								</div>
							</div>

							<div class="field">
								<div class="label flex space-between">

								</div>

									<textarea name="" id="" cols="30" rows="10"></textarea>

							<!-- // [D] li max 6개 -->
